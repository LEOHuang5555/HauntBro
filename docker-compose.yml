version: '3.8'

# ENV-based airflow configs (optional)
x-airflow-common:
  &airflow-common
  image: apache/airflow:3.0.3
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
    # AIRFLOW__CORE__AUTH_MANAGER: airflow.auth.managers.fab.fab_auth_manager.FabAuthManager

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    redis:
      condition: service_healthy
    airflow-db:
      condition: service_healthy

services:
  ######################
  ## HauntBro Services
  ######################

  hauntbro-db:
    image: postgres:14
    container_name: hauntbro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hauntbro
    volumes:
      - hauntbro_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    depends_on:
      - hauntbro-db
      - ollama
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@hauntbro-db:5432/hauntbro
      - OLLAMA_BASE_URL=http://ollama:11434
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint-simple.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      # Specify models to pull (space-separated)
      - OLLAMA_MODELS=llama3.2 deepseek-coder
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
       
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G  # Adjust based on your models
    #     reservations:
    #       memory: 4G

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: yes
    ports:
      - "9092:9092"

  ######################
  ## Airflow Core
  ######################

  airflow-db:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        airflow db migrate
    user: "0:0"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    # environment:
    #   - _AIRFLOW_WWW_USER_CREATE=true
    #   - _AIRFLOW_WWW_USER_USERNAME=admin
    #   - _AIRFLOW_WWW_USER_PASSWORD=admin
    #   - _AIRFLOW_WWW_USER_EMAIL=admin@example.com
    #   - _AIRFLOW_WWW_USER_FIRSTNAME=Admin
    #   - _AIRFLOW_WWW_USER_LASTNAME=User
    #   - _AIRFLOW_WWW_USER_ROLE=Admin

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    restart: always
    depends_on:
      airflow-webserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_pg:
  hauntbro_pg:
  ollama_data:
